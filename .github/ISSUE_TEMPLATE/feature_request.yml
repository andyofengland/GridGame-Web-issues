name: Feature request
description: Suggest an improvement or new capability for Gridlocked
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Ideas and feedback are welcome. This repo does not contain source code — requests are reviewed and may be implemented in private development repositories.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem would this solve for you?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
