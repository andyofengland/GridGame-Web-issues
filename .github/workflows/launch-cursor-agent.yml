name: Launch Cursor agent

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  launch:
    if: github.event.label.name == 'ready-for-dev' || github.event.label.name == 'ready-for-frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Cursor SDK
        run: npm install --no-save @cursor/sdk

      - name: Launch cloud agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
        run: node .github/scripts/launch-cursor-agent.mjs
