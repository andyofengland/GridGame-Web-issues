name: Ensure issue labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ensure-labels.yml'

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          create() {
            local name="$1" color="$2" desc="$3"
            gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$desc" 2>/dev/null \
              || gh label edit "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$desc"
          }
          create "needs-triage" "FBCA04" "Maintainer needs to evaluate this issue"
          create "needs-info" "D93F0B" "Waiting on reporter for more information"
          create "ready-for-agent" "0E8A16" "Triaged; Cursor may create a work-item and implement"
          create "ready-for-human" "1D76DB" "Triaged; requires human implementation"
          create "wontfix" "ffffff" "Will not be actioned"
          create "agent:blocked" "000000" "Cursor launcher or agent failed"
          create "in-dev" "C5DEF5" "Agent or human is implementing"
          create "in-review" "D4C5F9" "PR open against dev or main"
          create "shipped" "0E8A16" "Change is on main; ticket closed"
